# HookHarbor site for the droplet's shared nginx container.
# This repo copy is the only one to edit: deploying copies it into nginx's
# conf.d folder on the droplet and reloads nginx, so any change made directly
# on the droplet is overwritten.
# The droplet's 00-default.conf already provides the resolver, the
# HTTP → HTTPS redirect and the catch-all for unknown domains.
server {
    listen 443 ssl;
    http2 on;
    server_name hookharbor.chasephilpot.com;

    ssl_certificate /etc/letsencrypt/live/chasephilpot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chasephilpot.com/privkey.pem;

    # Same limit as Express's express.raw({ limit: "1mb" }) for captured bodies
    client_max_body_size 1m;

    location / {
        # A variable makes nginx look up the container per request, so nginx
        # still starts (and other sites stay up) if hook-harbor isn't running.
        # Must match container_name in docker-compose.yml.
        set $upstream http://hook-harbor:3000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
